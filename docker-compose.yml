services:
  postgres:
    image: postgres:16-alpine
    container_name: manah_tracking_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-manah_tracking}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
