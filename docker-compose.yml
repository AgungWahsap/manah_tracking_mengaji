services:
  postgres:
    image: postgres:16-alpine
    container_name: manah_tracking_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: manah
      POSTGRES_PASSWORD: manah_secret
      POSTGRES_DB: manah_tracking
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
